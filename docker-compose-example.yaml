services:
  tmdb_postgres:
    # Pin the PG minor and base-image digest so libc collation versions cannot drift.
    image: postgres:16.11-trixie@sha256:056b54f00419b49289227ab12d09df508543883f407fe9935a2cec430ef8aa8d
    container_name: tmdb_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - SOME_PATH:/var/lib/postgresql/data
    networks:
      - proxynet

  tmdb_service:
    image: ghcr.io/jessielw/tmdb-service:latest
    container_name: tmdb_service
    restart: unless-stopped
    depends_on:
      - tmdb_postgres
    env_file:
      - .env
    volumes:
      - SOME_PATH:/temp_dir
      - SOME_PATH:/logs
    networks:
      - proxynet
    command: ["python", "-m", "tmdb_service.worker"]

  tmdb_api:
    image: ghcr.io/jessielw/tmdb-service:latest
    container_name: tmdb_api
    restart: on-failure
    depends_on:
      - tmdb_postgres
    env_file:
      - .env
    networks:
      - proxynet
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    command: ["python", "-m", "tmdb_service.api_server"]

networks:
  proxynet:
    external: true
